change_master_volume:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
    volume:
      required: true
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: slider
change_doorbell_volume:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
    volume:
      required: true
      selector:
        number:
          min: 0
          max: 7
          step: 1
          mode: slider
trigger_police:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
              domain: alarm_control_panel
    silent:
      required: true
      selector:
        boolean:
trigger_auxilliary:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
              domain: alarm_control_panel
    silent:
      required: true
      selector:
        boolean:
trigger_fire:
  fields:
    entity_id:
      required: true
      selector:
