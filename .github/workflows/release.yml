name: Build

# Manual release. Dispatch from the Actions tab and pick the branch:
#   - main -> cuts a STABLE version (e.g. 1.9.1)
#   - dev  -> cuts a BETA pre-release (e.g. 1.9.1-beta.1)
# Stable-vs-beta is driven by the per-branch config in pyproject.toml
# ([tool.semantic_release.branches.*]). semantic-release bumps both
# pyproject.toml and custom_components/qolsys_panel/manifest.json.
# The qolsys-controller pin in the manifest is also channel-driven: a stable
# release pins the latest FINAL controller, a beta pins the latest controller
# incl. pre-releases (see the "Update qolsys-controller" step below). When that
# resolves a version newer than the current pin, the step commits it as a `fix:`
# so the controller bump is a release-triggering commit on its own.
#
# The bump level comes from the conventional commits since the last tag
# (feat -> minor, fix/perf -> patch) — including the controller `fix:` above.
# The `bump` input forces a level instead, e.g. to cut a release with no
# triggering commit at all.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a release level (normally auto from commits)"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

# Serialize releases on the same ref; queue rather than cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 0 — guard. Releases are only valid from main (stable) or dev (beta).
  guard:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Only main or dev may release
        run: |
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "dev" ]; then
            echo "::error::Releases may only be dispatched from 'main' (stable) or 'dev' (beta). Got '${{ github.ref_name }}'."
            exit 1
          fi
          echo "Releasing from '${{ github.ref_name }}'."

  # Stage 1 — checks. Reuse the same validations + lint + tests that run on
  # every push/PR so a release can never ship code that would fail CI.
  checks:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  # Stage 2 — release. Only runs if the branch is valid and checks passed.
  release:
    name: Semantic Version + Tag
    runs-on: ubuntu-latest
    needs: [guard, checks]

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install semantic-release
        run: python -m pip install python-semantic-release

      # Resolve the controller version this channel ships and, if it's newer than
      # the current pin, commit the bump: latest FINAL from main (stable), latest
      # incl. PRE-RELEASES from dev (beta, via `>=0a0` — pip's idiom for allowing
      # pre-releases of just this package). Resolved with pip's own resolver
      # (--dry-run --report, no install) so it matches exactly what Home Assistant
      # installs on a user's box.
      #
      # Committing it as a `fix:` makes the controller bump a release-triggering
      # commit on its own: semantic-release (next step) then cuts a patch (a beta
      # on dev) with no `bump` input needed. Skipped when already current, so a
      # dispatch with nothing else to ship is a genuine no-op.
      - name: Update qolsys-controller to latest for channel
        run: |
          python -m pip install --quiet --upgrade pip
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            QC="qolsys-controller"; CHANNEL="stable"
          else
            QC="qolsys-controller>=0a0"; CHANNEL="beta"
          fi
          python -m pip install --quiet --dry-run --report /tmp/qc.json "$QC"
          NEW="$(python -c 'import json;rep=json.load(open("/tmp/qc.json"));print(next(p["metadata"]["version"] for p in rep["install"] if p["metadata"]["name"].lower()=="qolsys-controller"))')"
          CUR="$(python -c 'import json;print(next(r.split("==",1)[1] for r in json.load(open("custom_components/qolsys_panel/manifest.json"))["requirements"] if r.startswith("qolsys-controller==")))')"
          # Surface the result on the run's Summary page (GITHUB_STEP_SUMMARY).
          echo "### qolsys-controller ($CHANNEL channel)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NEW" = "$CUR" ]; then
            echo "qolsys-controller already at $CUR; no bump."
            echo "ℹ️ Already at \`$CUR\` — no change." >> "$GITHUB_STEP_SUMMARY"
          else
            NEW="$NEW" python -c 'import json,re,os;v=os.environ["NEW"];p="custom_components/qolsys_panel/manifest.json";t=open(p).read();open(p,"w").write(re.sub(r"qolsys-controller==[0-9A-Za-z.+!_-]+","qolsys-controller=="+v,t))'
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: bump qolsys-controller to $NEW" custom_components/qolsys_panel/manifest.json
            echo "Bumped qolsys-controller $CUR -> $NEW"
            {
              echo "| | version |"
              echo "|---|---|"
              echo "| before | \`$CUR\` |"
              echo "| after | \`$NEW\` |"
              echo ""
              echo "✅ Bumped — committed as \`fix: bump qolsys-controller to $NEW\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # GITHUB_TOKEN is enough here: main/dev are not protected, so it can push
      # the version-bump commit + tag and create the GitHub release. If branch
      # protection with required status checks is ever added, that push will be
      # rejected — do NOT add such protection without a ruleset bypass actor.
      - name: Run semantic-release (bump + tag)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 'auto' lets conventional commits decide the bump (incl. the
          # controller `fix:` committed above); any other choice forces that
          # level. On dev the per-branch prerelease config turns the result
          # into the next beta.
          FORCE=""
          if [ "${{ inputs.bump }}" != "auto" ]; then
            FORCE="--${{ inputs.bump }}"
          fi
          # A changed HEAD means a new version was cut.
          BEFORE="$(git rev-parse HEAD)"
          semantic-release version $FORCE
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" != "$AFTER" ]; then
            git push --follow-tags
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "No new release; nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Stage 3 — restart the beta channel. After a STABLE release on main, reset dev
  # to the freshly released main so the next beta computes from the stable tag.
  # dev is a disposable beta branch: all real work reaches main via feature PRs,
  # so this force-push is intentional and discards any dev-only commits. Runs only
  # when a stable release was actually cut (released == 'true').
  sync-dev:
    name: Reset dev to main
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.released == 'true'

    steps:
      # ref: main + fetch-depth: 0 pulls the latest origin/main, which already
      # includes the release job's version-bump commit + tag (this job `needs`
      # it), so HEAD is the released commit.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force dev to the released main
        run: git push origin HEAD:dev --force
