name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  
permissions:
  contents: write

jobs:
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v5

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff & Mypy
    runs-on: ubuntu-latest
    needs:
      - commitlint
      - hassfest
      - hacs

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install pytest-homeassistant-custom-component==0.13.346 qolsys-controller mypy

      - name: Ruff check
        run: ruff check .

      - name: Run mypy
        run: mypy custom_components/ test/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    needs:
      - commitlint
      - hassfest
      - hacs

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pytest-homeassistant-custom-component==0.13.346 qolsys-controller mypy

      - name: Run pytest
        run: pytest

  release:
    name: Semantic Version + Tag
    runs-on: ubuntu-latest
    needs:
      - lint
      - pytest

    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install semantic-release
        run: python -m pip install python-semantic-release

      - name: Check semantic-release version
        run: semantic-release --version

      - name: Run semantic-release (stable)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version

      - name: Run semantic-release (beta)
        if: github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version --prerelease
