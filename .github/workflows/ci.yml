name: CI

# Validations + lint + tests. Runs on every push and PR to any branch, and is
# reusable (workflow_call) so the release workflow (release.yml) can gate a
# release on these same checks.
on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Commit-message lint only makes sense for real pushes/PRs, not when this
  # workflow is reused by release.yml (workflow_dispatch). Nothing depends on
  # it, so skipping it there doesn't block the release gate.
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff & MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # Install the controller version this branch's release channel would
          # ship, so CI tests exactly what ships: latest FINAL for the stable
          # channel (main), latest incl. PRE-RELEASES for the beta channel (dev
          # and feature branches). `>=0a0` names a pre-release, which is pip's
          # idiom for allowing pre-releases of just this one package (no global
          # --pre that could leak pre-releases into other deps).
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ]; then
            QC="qolsys-controller"
          else
            QC="qolsys-controller>=0a0"
          fi
          pip install ruff mypy pytest-homeassistant-custom-component==0.13.367 "$QC"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy check
        run: mypy custom_components/ test/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # Match the stable/beta channel (see the lint job for the rationale):
          # final-only for main, latest incl. pre-releases elsewhere.
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ]; then
            QC="qolsys-controller"
          else
            QC="qolsys-controller>=0a0"
          fi
          pip install pytest-homeassistant-custom-component==0.13.367 "$QC" mypy
      - name: Pytest
        run: pytest
