name: CI

# Validations + lint + tests. Runs on every push and PR to any branch, and is
# reusable (workflow_call) so the release workflow (publish.yml) can gate a
# release on these exact same checks without duplicating the steps.
#
# PR-title linting lives in main-pr-title.yml, not here: main squash-merges with
# the PR title as the commit subject (that string drives the version bump and the
# CHANGELOG entry), so the title is what must be a conventional commit — there is
# no per-commit commitlint step.
on:
  push:
  pull_request:
  workflow_call:

# Cancel superseded runs of the same event on the same ref. push and
# pull_request are separate events, so a branch with an open PR still runs CI
# once per event (standard GitHub behavior) — only re-runs of each are culled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff & MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # Install the controller version this branch's release channel would
          # ship, so CI tests exactly what ships: latest FINAL for the stable
          # channel (main), latest incl. PRE-RELEASES for the beta channel (dev
          # and feature branches). `>=0a0` names a pre-release, which is pip's
          # idiom for allowing pre-releases of just this one package (no global
          # --pre that could leak pre-releases into other deps).
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ]; then
            QC="qolsys-controller"
          else
            QC="qolsys-controller>=0a0"
          fi
          pip install ruff mypy pytest-homeassistant-custom-component==0.13.367 "$QC"
      # `--output-format=github` emits ::error workflow commands, so lint
      # violations show as inline annotations on the PR diff (and the run), not
      # just buried in the step log. Silent on success.
      - name: Ruff check
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy check
        run: mypy custom_components/ test/

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          # Match the stable/beta channel (see the lint job for the rationale):
          # final-only for main, latest incl. pre-releases elsewhere.
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_BASE_REF" = "main" ]; then
            QC="qolsys-controller"
          else
            QC="qolsys-controller>=0a0"
          fi
          pip install pytest-homeassistant-custom-component==0.13.367 "$QC" mypy pytest-md-report
      # Run the suite and, via pytest-md-report, emit a plain-markdown per-file
      # results table to a file (color=never → no LaTeX, verbose=0 → one row per
      # test file + a TOTAL). The table goes to the file only; normal pytest
      # output still streams to the step log.
      - name: Pytest
        run: >
          pytest
          --md-report
          --md-report-flavor github
          --md-report-color never
          --md-report-verbose 0
          --md-report-output pytest-md-report.md
      # Surface that table on the run's Summary page. `always()` so it shows even
      # when the suite fails (the report is written regardless, with failure
      # counts); the guard avoids erroring if a hard collection crash wrote none.
      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## 🧪 Pytest results"
            echo
            if [ -f pytest-md-report.md ]; then
              cat pytest-md-report.md
            else
              echo "_No report produced — pytest failed before the run finished._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
