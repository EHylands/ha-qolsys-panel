name: MAIN - On Merge

# Runs when a feature PR is MERGED into main (feature → main is how features ship
# in this model) and removes the now-obsolete `beta` label from it. Merging
# already closes the PR, and dev isn't rebuilt here: the next beta Build resets
# dev to main and re-merges the open `beta` PRs before it runs.
#
# pull_request_target runs in the base-repo context with a write-capable token so
# this works for fork PRs too. Safe here: no PR code is ever checked out or
# executed — the job only calls the GitHub API.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  # Drop the `beta` label from the shipped PR so the label only marks in-flight
  # PRs. The rebuild lists open PRs only, so this is tidiness, not correctness.
  # Only when the PR actually MERGED and still carries the label. Uses
  # GITHUB_TOKEN with just pull-requests: write.
  remove-beta-label:
    name: Drop beta label
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'beta')
    permissions:
      pull-requests: write
    steps:
      - name: Remove `beta` label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label beta
          echo "Removed 'beta' label from merged PR #$PR."
