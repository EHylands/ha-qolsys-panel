[mypy]
python_version = 3.14
warn_unused_configs = True
disallow_untyped_defs = True
ignore_missing_imports = True
strict = True
explicit_package_bases = True
# Override a strict sub-flag: homeassistant and qolsys_controller don't mark
# their public names as explicit re-exports (no __all__ / aliased imports), so
# no_implicit_reexport only produces noise for an integration that consumes them.
implicit_reexport = True

# pytest mocking legitimately reassigns entity methods to MagicMocks and leaves
# test functions/fixtures unannotated; relax the strict sub-flags that only fire
# on those patterns while keeping the rest of type-checking active on tests.
# (mypy names the test modules under the "test" namespace package.)
[mypy-test.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
# assignment: tests configure mocked backing objects (_partition/_zone/_service)
# by setting attributes whose declared types differ from the mock values.
disable_error_code = method-assign, misc, assignment